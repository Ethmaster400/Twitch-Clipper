[project]
name = "claud"
version = "0.1.0"
description = "Repost popular Twitch clips from opted-in streamers to YouTube Shorts and TikTok"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "yt-dlp>=2024.1.1",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.1",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",   # YuNet face detector for facecam detection
    "anthropic>=1.0",                # AI hook text
]

[project.optional-dependencies]
captions = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "scikit-image>=0.22"]  # scikit-image: sample face photo for tests

[project.scripts]
claud = "claud.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claud*"]

[tool.setuptools.package-data]
claud = ["models/*.onnx"]
